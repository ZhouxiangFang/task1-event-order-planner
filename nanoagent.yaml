_ > nanoagent.plugin.v0001.ManifestConfig:
id: event-order-planner
name: Event Order Planner
version: 0.4.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  list_events:
    description: |-
      List a graph's events, sorted by name. Pass the task's graph name unchanged.
      Returns {"graph": "<name>", "events": [...]}. Names outside g01 to g20 raise "no graph found".
  get_prerequisites:
    description: |-
      Get an event's direct prerequisites, sorted by name. Use the task's graph and an exact event name from list_events.
      Returns {"event": "<name>", "prerequisites": [...]}. Each prerequisite must precede the event; an empty list means none.
      A self-reference or a prerequisite missing from the graph makes ordering impossible. Unknown graphs or events raise errors.

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  plan-event-order:
    description: Order a graph's events after their prerequisites, or report an impossible order or unknown graph.
    runner: agent
    tools: [list_events, get_prerequisites]
    reference: null
    instructions: |-
      1. Call list_events with the task's graph. If it reports "no graph found", submit {"status": "no_graph_found", "order": []}.
      2. Call get_prerequisites for every listed event in parallel; turns are limited.
      3. Submit {"status": "ordered", "order": [...]} with every event exactly once, after all its prerequisites. Any valid order is accepted.
      4. For a cycle, self-reference, or missing prerequisite, submit {"status": "no_valid_order", "order": []}.
