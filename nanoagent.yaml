_ > nanoagent.plugin.v0001.ManifestConfig:
id: event-order-planner
name: Event Order Planner
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  get_prerequisites:
    description: |-
      Look up the direct prerequisites of one event. Set graph to the graph ID from the task input and event to an exact event name from its events list.
      Returns {"event": "<requested event>", "prerequisites": ["<event name>", ...]}. Every returned prerequisite must appear strictly before the requested event in your final order. The list is sorted by name; an empty list means this event has no prerequisites.
      For example, {"event": "E", "prerequisites": ["AB", "H"]} means both AB and H must occur before E. Call this tool for every event in the task input to obtain all ordering constraints.
      A prerequisite may name the event itself or an event absent from the task input; either makes a valid order impossible. Requesting an event absent from the graph returns an error.

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  plan-event-order:
    description: Find a valid event order that satisfies all prerequisites, or determine that no valid order exists
    runner: agent
    tools: [get_prerequisites]
    reference: null
    instructions: |-
      Use get_prerequisites to read every listed event's prerequisites. Find any order containing every listed event exactly once, with all prerequisites strictly before their dependent events.
      Call submit with {"solvable": true, "order": [...]} for a valid order, or {"solvable": false, "order": []} if none exists.
