_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Put events in an order that keeps every prerequisite"
summary: "Give it one of twenty bundled event graphs and its events. The agent reads each event's prerequisites and returns an order in which every event comes after everything it needs, or says that no such order exists. A deterministic verifier checks the answer."
highlights:
  - "Any valid order passes: the verifier checks the prerequisites, not one fixed answer"
  - "Twenty graphs, from a single event to cycles, self-loops and missing prerequisites"
  - "No model and no network in the verifier: the same answer always gets the same verdict"
steps:
  - "Ask it to order a graph's events, such as g18's G, J, N, R, T and W"
  - "The agent reads each event's prerequisites with get_prerequisites"
  - "It returns an order, or says none exists, and the verifier judges it"
